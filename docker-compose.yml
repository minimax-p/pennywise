# Runs Pennywise on a single server: the app, MariaDB, Caddy for HTTPS and a daily backup.
# Setup: see "Deploying to a server" in README.md. Settings come from .env next to this file.

x-database-url: &database-url mysql://pennywise:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:3306/pennywise

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pennywise
      MARIADB_USER: pennywise
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    # Small memory footprint for a 1 GB server
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--max-connections=40"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Applies database migrations and adds the shared categories, then exits
  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: *database-url
    command: ["sh", "-c", "npx prisma migrate deploy && node prisma/seed.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Dumps the database every day into ./backups and keeps two weeks of files
  backup:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          sleep 60
          file=/backups/pennywise-$$(date +%Y-%m-%d).sql.gz
          if mariadb-dump -h db -u pennywise -p"$$MARIADB_PASSWORD" --single-transaction pennywise | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            find /backups -name 'pennywise-*.sql.gz' -mtime +14 -delete
          else
            rm -f "$$file.tmp"
          fi
          sleep 86340
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
